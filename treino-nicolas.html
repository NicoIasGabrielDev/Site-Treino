<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Treino NL">
<title>Treino — Nicolas Lima</title>
<style>
:root {
  --bg: #0E0E14;
  --surface: #1A1A24;
  --surface2: #22222E;
  --border: #2E2E3E;
  --accent: #4EE06E;
  --accent-dim: #132518;
  --text: #EBEBF0;
  --text2: #7878A0;
  --warn: #F0A030;
  --warn-dim: #2A1C00;
  --danger: #E06060;
  --danger-dim: #2A1010;
  --blue: #4898F0;
  --blue-dim: #081828;
  --purple: #9868E0;
  --purple-dim: #1A0F2E;
  --nav-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

/* TOP BAR */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(var(--safe-t) + 14px) 16px 12px;
  background: rgba(14,14,20,0.96);
  border-bottom: 0.5px solid var(--border);
  z-index: 200;
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.4px; }
.topbar p { font-size: 11px; color: var(--text2); margin-top: 1px; }

/* BOTTOM NAV */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(26,26,36,0.97);
  border-top: 0.5px solid var(--border);
  display: flex; z-index: 200;
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.nb {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  font-size: 10px; color: var(--text2);
  background: transparent; border: none; font-family: inherit;
  padding: 6px 4px; cursor: pointer;
}
.nb.active { color: var(--accent); }
.ni { font-size: 20px; line-height: 1; }

/* SCROLL AREA */
.main {
  padding-top: calc(var(--safe-t) + 62px);
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
}
.section { display: none; }
.section.active { display: block; }

/* SAVE BANNER */
.save-tip {
  margin: 10px 14px 0;
  padding: 10px 13px;
  background: var(--blue-dim);
  border: 0.5px solid var(--blue);
  border-radius: 10px;
  font-size: 12px;
  color: #80B8FF;
  line-height: 1.5;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.save-tip button { background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; flex-shrink: 0; }

/* DAY PILLS */
.day-scroll {
  display: flex; gap: 7px;
  padding: 10px 14px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  border-bottom: 0.5px solid var(--border);
}
.day-scroll::-webkit-scrollbar { display: none; }
.dp {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px; font-size: 12px; font-weight: 600;
  background: var(--surface); color: var(--text2);
  border: 0.5px solid var(--border); font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.dp.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* EXERCISE LIST */
.elist { padding: 8px 14px 6px; }

.fhl-warn {
  background: var(--danger-dim); border: 0.5px solid var(--danger);
  border-radius: 10px; padding: 9px 13px; margin-bottom: 10px;
  font-size: 12px; color: #F09090; display: flex; align-items: center; gap: 8px;
}

.blk-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--text2);
  margin: 14px 0 7px;
}
.blk-label:first-child { margin-top: 4px; }

.ec {
  background: var(--surface); border-radius: 12px;
  padding: 11px 13px; margin-bottom: 7px;
  border: 0.5px solid var(--border);
  position: relative; overflow: hidden;
}
.ec::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.ec.strength::before { background: var(--accent); }
.ec.warm::before     { background: #555568; }
.ec.cardio::before   { background: var(--blue); }
.ec.fhl::before      { background: var(--danger); }
.ec.added::before    { background: var(--warn); }
.ec.core::before     { background: var(--purple); }
.ec.rsa::before      { background: var(--warn); }

.ec-tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; margin-bottom: 5px;
}
.tag-a { background: var(--warn-dim); color: var(--warn); }
.tag-f { background: var(--danger-dim); color: var(--danger); }

.ec-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
.ec-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
.chip {
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border);
}
.chip.hi { color: var(--accent); background: var(--accent-dim); border-color: #1E4828; }
.ec-note { font-size: 12px; color: var(--text2); line-height: 1.4; font-style: italic; }

/* MOBILITY */
.mob-tabs {
  display: flex; padding: 10px 14px; gap: 7px;
  border-bottom: 0.5px solid var(--border);
}
.mt {
  flex: 1; padding: 8px 4px; border-radius: 10px;
  font-size: 11px; font-weight: 600; text-align: center;
  background: var(--surface); color: var(--text2);
  border: 0.5px solid var(--border); font-family: inherit; cursor: pointer;
  line-height: 1.4;
}
.mt.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.mc { display: none; padding: 10px 14px; }
.mc.active { display: block; }

.mob-hdr {
  background: var(--surface); border-radius: 10px;
  padding: 10px 13px; margin-bottom: 10px; border: 0.5px solid var(--border);
}
.mob-hdr-t { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.mob-hdr-s { font-size: 11px; color: var(--text2); }
.mob-note { font-size: 12px; color: var(--text2); font-style: italic; margin-bottom: 12px; line-height: 1.4; }

.mcard {
  background: var(--surface); border-radius: 12px;
  padding: 11px 13px; margin-bottom: 7px;
  border-left: 3px solid var(--border); border-top: 0.5px solid var(--border);
  border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border);
}
.mcard.hip       { border-left-color: var(--warn); }
.mcard.hamstring { border-left-color: var(--blue); }
.mcard.ankle     { border-left-color: var(--danger); }
.mcard.thoracic  { border-left-color: var(--accent); }
.mcard.hip-flex  { border-left-color: var(--purple); }
.mcard.full      { border-left-color: #666680; }
.mcard.glute     { border-left-color: #E08030; }
.mcard.breath    { border-left-color: var(--accent); }

.mcard-dur {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 4px;
  background: var(--surface2); color: var(--text2); margin-bottom: 4px;
}
.mcard-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.mcard-spec { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.mcard-cue  { font-size: 12px; color: var(--text2); font-style: italic; line-height: 1.4; }

/* FHL */
.fhl-wrap { padding: 10px 14px; }
.fhl-intro {
  background: var(--danger-dim); border: 0.5px solid var(--danger);
  border-radius: 10px; padding: 12px 13px; margin-bottom: 14px;
  font-size: 13px; color: #F09090; line-height: 1.5;
}
.fhl-phase {
  font-size: 10px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--text2); margin: 14px 0 8px;
}
.fhl-step {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--surface); border-radius: 12px;
  padding: 11px 13px; margin-bottom: 7px; border: 0.5px solid var(--border);
}
.fhl-num {
  min-width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-dim); color: var(--accent);
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.fhl-step-t { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.fhl-step-d { font-size: 12px; color: var(--text2); line-height: 1.4; }
.fhl-alert {
  background: var(--danger-dim); border: 0.5px solid var(--danger);
  border-radius: 10px; padding: 12px 13px; margin-top: 14px;
  font-size: 12px; color: #F09090; line-height: 1.7;
}
.fhl-alert strong { display: block; font-size: 13px; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Nicolas Lima</h1>
  <p>Condicionamento físico · Intermediário · Pré-época</p>
</div>

<div class="main">

  <!-- TREINO -->

      <button onclick="document.getElementById('stip').style.display='none'">OK</button>
    </div>
    <div class="day-scroll">
      <button class="dp active" onclick="selDay('seg',this)">Seg — Força</button>
      <button class="dp" onclick="selDay('ter',this)">Ter — Pliometria</button>
      <button class="dp" onclick="selDay('qua',this)">Qua — Costas</button>
      <button class="dp" onclick="selDay('qui',this)">Qui — Pernas</button>
      <button class="dp" onclick="selDay('sex',this)">Sex — Peito</button>
      <button class="dp" onclick="selDay('sab',this)">Sáb — Recuperação</button>
    </div>
    <div class="elist" id="day-content"></div>
  </div>

  <!-- MOBILIDADE -->
  <div class="section" id="sec-mobilidade">
    <div class="mob-tabs">
      <button class="mt active" onclick="selMob('manha',this)">Manhã<br>18 min</button>
      <button class="mt" onclick="selMob('pos',this)">Pós-treino<br>15 min</button>
      <button class="mt" onclick="selMob('noite',this)">Noite<br>10 min</button>

    <div class="mc active" id="mc-manha"></div>
    <div class="mc" id="mc-pos"></div>
    <div class="mc" id="mc-noite"></div>
  </div>

  <!-- FHL -->
  <div class="section" id="sec-fhl">
    <div class="fhl-wrap" id="fhl-content"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bnav">

  </button>
  <button class="nb" onclick="selSec('fhl',this)">

</nav>

// ── RENDER ──────────────────────────────────────────────────────────────
function renderDay(key) {
  const day = days[key];
  let h = '';
  if (day.fhl) h += `<div class="fhl-warn">⚑ Fazer protocolo FHL antes deste treino — ver aba Tendão FHL</div>`;
  day.blocks.forEach(b => {
    h += `<div class="blk-label">${b.label}</div>`;
    b.exs.forEach(e => {
      let tag = '';
      if (e.tag === 'a') tag = `<div class="ec-tag tag-a">${e.tl}</div>`;
      if (e.tag === 'f') tag = `<div class="ec-tag tag-f">${e.tl}</div>`;
      h += `<div class="ec ${e.t}">
        ${tag}
        <div class="ec-name">${e.n}</div>
        <div class="ec-meta">
          <span class="chip hi">${e.s}</span>
          <span class="chip">${e.c}</span>
          <span class="chip">⏱ ${e.r}</span>
        </div>
        ${e.note ? `<div class="ec-note">${e.note}</div>` : ''}
      </div>`;
    });
  });
  document.getElementById('day-content').innerHTML = h;
}

function renderMob() {
  ['manha','pos','noite'].forEach(k => {
    const m = mob[k];
    let h = `<div class="mob-hdr"><div class="mob-hdr-t">${m.title}</div><div class="mob-hdr-s">${m.sub}</div></div>
      <div class="mob-note">${m.note}</div>`;
    m.items.forEach(i => {
      h += `<div class="mcard ${i.tp}">
        <div class="mcard-dur">${i.d}</div>
        <div class="mcard-name">${i.n}</div>
        <div class="mcard-spec">${i.sp}</div>
        <div class="mcard-cue">${i.c}</div>
      </div>`;
    });
    document.getElementById('mc-' + k).innerHTML = h;
  });
}

function renderFHL() {
  let h = `<div class="fhl-intro">${fhl.intro}</div>`;
  let n = 1;
  fhl.phases.forEach(p => {
    h += `<div class="fhl-phase">${p.label}</div>`;
    p.steps.forEach(s => {
      h += `<div class="fhl-step">
        <div class="fhl-num">${n++}</div>
        <div><div class="fhl-step-t">${s.t}</div><div class="fhl-step-d">${s.d}</div></div>
      </div>`;
    });
  });
  h += `<div class="fhl-alert"><strong>Sinais de alerta — consultar fisioterapeuta:</strong>${fhl.alert.split('\n').join('<br>')}</div>`;
  document.getElementById('fhl-content').innerHTML = h;
}

// ── NAVIGATION ──────────────────────────────────────────────────────────
function selSec(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  btn.classList.add('active');
}

function selDay(key, btn) {
  document.querySelectorAll('.dp').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderDay(key);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selMob(key, btn) {
  document.querySelectorAll('.mt').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.mc').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mc-' + key).classList.add('active');
}

// ── INIT ────────────────────────────────────────────────────────────────
renderDay('seg');
renderMob();
